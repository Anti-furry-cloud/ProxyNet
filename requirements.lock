# Neden var: requirements.txt aralik veriyordu (PySide6>=6.6), yani bir ay
# sonra derleyen baska bir Qt aliyordu ve exe farkli cikiyordu. Yeniden
# uretilebilir derleme (THREAT_MODEL 5.9) once bunu sabitlemeyi gerektiriyor.
#
# Asil kazanc derlemeden buyuk: --require-hashes ile kurulum, PyPI'daki bir
# dosya sonradan degistirilmisse REDDEDER. Bu bir tedarik zinciri korumasi.
#
# Kullanim:
#     pip install --require-hashes -r requirements.lock
#
# Hedef ortam: Python 3.11 / Windows x64. Baska bir Python ya da platform
# icin wheel'ler degisir; kilit yeniden uretilmelidir.
#
# pytest ve diger gelistirme araclari burada YOK; onlar dagitilan dosyanin
# parcasi degil (bkz. requirements-dev.txt).
#
# Bir pakette birden fazla ozet varsa (cryptography), PyPI o surum icin birden
# fazla uyumlu wheel yayinlamis demektir; pip hangisini secerse secsin kilitli
# olsun diye hepsi yaziliyor.

